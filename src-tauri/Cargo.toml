[package]
name = "striker-mini"
version = "0.1.0"
description = "Striker Mini — pick a tree, check what you did, strike the day"
authors = ["Striker"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "striker_mini_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
